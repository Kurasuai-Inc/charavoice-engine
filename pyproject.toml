[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "charavoice-engine"
version = "1.0.0"
description = "Low-latency high-throughput bilingual JP-Extra TTS engine"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    # NLP dependencies
    "cmudict",
    "g2p_en",
    "nltk",
    "num2words",
    "numba>=0.61.0",
    "numpy",
    "pydantic>=2.0",
    "pyopenjtalk-plus",
    "safetensors",
    "setuptools",
    "transformers>=4.36,<5",
    # charavoice_engine runtime
    "torch>=2.6",
    "onnxruntime-gpu>=1.24.2",
    "soundfile>=0.13.1",
    "psutil",
    "accelerate>=1.12.0",
    "onnx>=1.19.0",
    "onnxsim>=0.6.2",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn[standard]",
    "av>=14.0",
    "prometheus-client>=0.21",
    "aiohttp",
]
tensorrt = [
    "tensorrt-cu12>=10.15.1.29",
    "tensorrt-cu12-bindings>=10.15.1.29",
    "tensorrt-cu12-libs>=10.15.1.29",
]
convert = [
    "torchaudio>=2.6",
    "accelerate",
    "onnx>=1.19.0",
    "onnxscript>=0.5.0",
    "onnxsim>=0.6.2",
    "onnxconverter-common>=1.14.0",
]
train = [
    "librosa>=0.10",
    "matplotlib>=3.9",
    "pyannote.audio>=3.3",
    "scipy>=1.14",
    "tensorboard>=2.19",
    "torchaudio>=2.6",
    "tqdm>=4.66",
]
dev = [
    "aiohttp>=3.13.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pyright>=1.1.390",
]
watermark = [
    "audioseal>=0.2",
    "onnxscript>=0.5.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/charavoice_engine"]

# --- Developer tools ---

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Model modules: ported from Style-Bert-VITS2, retaining original patterns
"src/charavoice_engine/models/**" = [
    "E741",    # ambiguous-variable-name (ported style)
    "E712",    # true-false-comparison (ported style)
    "B007",    # unused-loop-control-variable (ported style)
    "B905",    # zip-without-explicit-strict (ported style)
    "SIM108",  # if-else-block-instead-of-if-exp (ported style)
    "SIM401",  # if-else-block-instead-of-dict-get (ported style)
    "RUF005",  # collection-literal-concatenation (ported style)
    "RUF034",  # useless-if-else (ported style)
    "RUF059",  # unpacked-variable-not-used (ported style)
    "UP008",   # super-call-with-parameters (ported style)
    "SIM118",  # in-dict-keys (safetensors API requires .keys())
]
# Japanese NLP modules: fullwidth Japanese chars in strings/comments/docstrings are intentional,
# and vendored code retains original style patterns
"src/charavoice_engine/nlp/japanese/**" = [
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode (Japanese fullwidth chars)
    "RUF005",  # collection-literal-concatenation (vendored style)
    "RUF028",  # invalid-formatter-suppression-comment (vendored fmt: skip)
    "E402",    # module-import-not-at-top (docstring before imports)
    "E731",    # lambda-assignment (vendored style)
    "B905",    # zip-without-explicit-strict (vendored style)
    "B007",    # unused-loop-control-variable (vendored style)
    "B904",    # raise-without-from-inside-except (vendored style)
    "SIM102",  # collapsible-if (vendored style)
    "SIM105",  # suppressible-exception (vendored style)
    "SIM108",  # if-else-block-instead-of-if-exp (vendored style)
    "SIM118",  # in-dict-keys (vendored style)
    "UP042",   # replace-str-enum (Pydantic model constraints)
]
# Server app: FastAPI uses Query() in default args idiomatically
"src/charavoice_engine/server/app.py" = [
    "B008",    # function-call-in-default-argument (FastAPI Query/Depends pattern)
]
# Text splitter: fullwidth Japanese punctuation in split chars is intentional
"src/charavoice_engine/nlp/text_splitter.py" = [
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode (Japanese fullwidth chars)
]
# Symbols: list concatenation style is clear and intentional
"src/charavoice_engine/nlp/symbols.py" = [
    "RUF005",  # collection-literal-concatenation (intentional style)
]

[tool.ruff.lint.isort]
known-first-party = ["charavoice_engine"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src/charavoice_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: requires CUDA GPU",
    "slow: slow tests (> 10s)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
watermark = [
    "audioseal>=0.2",
]
